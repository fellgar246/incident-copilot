name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      eval_profile:
        description: Evaluation profile
        required: true
        default: full
        type: choice
        options:
          - pr
          - release
          - full

# Do not cancel an in-flight apply. A newer push queues behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: lint-typecheck-test-security-eval-terraform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/cost-guardrails -e packages/contracts -e packages/observability -e packages/evaluations -e services/simulator -e services/incident-worker -e services/tools/cloudwatch -e services/tools/deployments -e services/tools/knowledge -e services/tools/remediation -e services/agent -e apps/api -e ".[dev]"
          npm ci

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: make test-integration

      - name: Security checks
        run: make security

      - name: Offline AI evaluations
        env:
          EVAL_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.eval_profile || (github.event_name == 'pull_request' && 'pr' || 'release') }}
        run: python scripts/run_evaluations.py --profile "$EVAL_PROFILE"

      - name: Terraform fmt and validate
        run: make terraform-validate

      - name: Verify quotas and circuit breaker
        run: python scripts/verify_quotas.py

  plan-and-deploy:
    name: plan-and-deploy-dev
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' && vars.TF_LOCK_TABLE != '' && vars.TF_TFVARS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: ci-deploy-dev

      - name: Write terraform.tfvars
        env:
          TF_TFVARS: ${{ vars.TF_TFVARS }}
        run: printf '%s\n' "$TF_TFVARS" > infra/environments/dev/terraform.tfvars

      - name: Configure remote backend
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          python scripts/configure_remote_backend.py \
            --bucket "$TF_STATE_BUCKET" \
            --table "$TF_LOCK_TABLE" \
            --region "$AWS_REGION"

      - name: Terraform init
        working-directory: infra/environments/dev
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Terraform plan
        working-directory: infra/environments/dev
        run: terraform plan -input=false -out=tfplan

      - name: Deploy dev
        working-directory: infra/environments/dev
        run: terraform apply -input=false tfplan

      - name: Publish dashboard
        run: |
          npm ci
          export NEXT_PUBLIC_API_BASE_URL="$(terraform -chdir=infra/environments/dev output -raw api_endpoint)"
          npm run build -w web
          aws s3 sync apps/web/out "s3://$(terraform -chdir=infra/environments/dev output -raw web_bucket_name)" --delete
          aws cloudfront create-invalidation \
            --distribution-id "$(terraform -chdir=infra/environments/dev output -raw web_distribution_id)" \
            --paths "/*"

      - name: Smoke test
        run: python scripts/smoke_deploy.py --base-url "$(terraform -chdir=infra/environments/dev output -raw api_endpoint)"
