name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint-typecheck-test-terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/cost-guardrails -e packages/contracts -e packages/observability -e services/simulator -e services/incident-worker -e services/tools/cloudwatch -e services/tools/deployments -e services/tools/knowledge -e services/agent -e apps/api -e ".[dev]"

      - name: Install Node workspaces
        run: npm ci

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test

      - name: Terraform fmt and validate
        run: make terraform-validate
