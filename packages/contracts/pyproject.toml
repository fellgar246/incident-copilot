[project]
name = "incident-contracts"
version = "0.1.0"
description = "Shared domain contracts for incidents, events, and tools."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
incident_contracts = ["py.typed", "schemas/*.json", "schemas/tools/*.json"]
