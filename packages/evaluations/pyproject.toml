[project]
name = "evaluations"
version = "0.1.0"
description = "Offline incident evaluation runner and quality gates."
requires-python = ">=3.12"
dependencies = [
  "incident-agent",
  "incident-contracts",
  "simulator",
  "cloudwatch-tool",
  "deployments-tool",
  "knowledge-tool",
  "remediation-tool",
  "cost-guardrails",
  "pydantic>=2.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evaluations = ["py.typed"]
