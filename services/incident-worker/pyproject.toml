[project]
name = "incident-worker"
version = "0.1.0"
description = "SQS worker that ingests incident.detected.v1 events into DynamoDB."
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "incident-contracts",
  "observability",
  "cost-guardrails",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
