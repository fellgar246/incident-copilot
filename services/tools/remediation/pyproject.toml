[project]
name = "remediation-tool"
version = "0.1.0"
description = "Safe-write remediation. Requests do not execute; execution requires a grant."
requires-python = ">=3.12"
dependencies = [
  "incident-contracts",
  "observability",
  "pydantic>=2.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
remediation_tool = ["py.typed"]
