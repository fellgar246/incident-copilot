[project]
name = "knowledge-tool"
version = "0.1.0"
description = "Read-only runbook retrieval over the operational corpus."
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "cost-guardrails",
  "incident-contracts",
  "pydantic>=2.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knowledge_tool = ["py.typed"]
