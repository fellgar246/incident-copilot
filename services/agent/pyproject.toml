[project]
name = "incident-agent"
version = "0.1.0"
description = "Incident investigation agent with bounded Bedrock turns."
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "cost-guardrails",
  "incident-contracts",
  "jsonschema>=4.23",
  "observability",
  "pydantic>=2.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent = ["py.typed"]
