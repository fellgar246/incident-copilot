[project]
name = "api"
version = "0.1.0"
description = "FastAPI HTTP API for incidents."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "mangum>=0.19",
  "boto3>=1.35",
  "uvicorn>=0.30",
  "incident-agent",
  "incident-contracts",
  "observability",
  "simulator",
  "cloudwatch-tool",
  "deployments-tool",
  "remediation-tool",
  "cost-guardrails",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
